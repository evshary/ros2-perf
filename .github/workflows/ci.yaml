name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**"
  schedule:
    - cron: '0 1 * * *'
  # Able to call by other workflow
  workflow_call:
  # Able to call on GitHub
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  markdown_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          config: '.markdownlint.yaml'
          globs: '**/*.md'

  build_test_ros2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            container_image: rostooling/setup-ros-docker:ubuntu-jammy-ros-humble-ros-base-latest
          - ros_distro: jazzy
            container_image: rostooling/setup-ros-docker:ubuntu-noble-ros-jazzy-ros-base-latest
          - ros_distro: kilted
            container_image: rostooling/setup-ros-docker:ubuntu-noble-ros-kilted-ros-base-latest
    container:
      image: ${{ matrix.container_image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: perf
          target-ros2-distro: ${{ matrix.ros_distro }}
          coverage-result: false
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                  "-DCMAKE_CXX_FLAGS=\"-Werror\""
                ]
              }
            }
      - uses: actions/upload-artifact@v4
        with:
          name: colcon-logs-${{ matrix.ros_distro }}
          path: ros_ws/log
